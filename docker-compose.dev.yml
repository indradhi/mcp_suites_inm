# ─────────────────────────────────────────────
#  Development overrides — local laptop
#  Usage: make dev
# ─────────────────────────────────────────────

services:

  mysql:
    ports:
      - "3309:3306"

  redis:
    ports:
      - "6380:6379"

  chromadb:
    ports:
      - "8100:8000"

  neo4j:
    ports:
      - "7474:7474"
      - "7687:7687"

  mcp-server:
    ports:
      - "8001:8001"
    volumes:
      - ./services/mcp_server:/app
      - ./data/uploads:/app/uploads
    environment:
      LOG_LEVEL: DEBUG
      RELOAD: "true"
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    dns:
      - 172.16.11.14
      - 172.16.11.13
      - 172.20.10.1
      - 8.8.8.8

  backoffice-api:
    ports:
      - "8002:8000"
    volumes:
      - ./services/backoffice_api:/app
      - ./data/uploads:/app/uploads
    extra_hosts:
      - "pianaru:172.16.21.66"
    environment:
      LOG_LEVEL: DEBUG
      RELOAD: "true"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    dns:
      - 172.16.11.14
      - 172.16.11.13
      - 172.20.10.1
      - 8.8.8.8

  celery-worker:
    environment:
      LOG_LEVEL: DEBUG
    volumes:
      - ./services/backoffice_api:/app
      - ./data/uploads:/app/uploads
    extra_hosts:
      - "pianaru:172.16.21.66"
    dns:
      - 172.16.11.14
      - 172.16.11.13
      - 172.20.10.1
      - 8.8.8.8

  backoffice-ui:
    image: mcp_server_in_cec-backoffice-ui:latest
    build:
      context: ./services/backoffice_ui
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./services/backoffice_ui/src:/app/src
      - ./services/backoffice_ui/vite.config.js:/app/vite.config.js
    command: npm run dev -- --host 0.0.0.0

